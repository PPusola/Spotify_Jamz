<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background gradient: brand purple → pink -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="55%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" />
    </filter>
  </defs>

  <!-- Rounded square background (Android adaptive-icon friendly) -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Soft inner glow -->
  <circle cx="256" cy="240" r="180" fill="#FFFFFF" opacity="0.07" filter="url(#softShadow)" />

  <!-- Heart-shaped soundwave: vertical bars whose heights trace a heart -->
  <!-- Each bar is centered on x with height h. Colors all white with varying opacity. -->
  <g fill="#FFFFFF">
    <!-- Outer pair (low) -->
    <rect x="96"  y="232" width="20" height="48"  rx="10" opacity="0.55" />
    <rect x="396" y="232" width="20" height="48"  rx="10" opacity="0.55" />

    <!-- Step in -->
    <rect x="128" y="208" width="20" height="96"  rx="10" opacity="0.75" />
    <rect x="364" y="208" width="20" height="96"  rx="10" opacity="0.75" />

    <!-- Heart lobes (tallest at the curves) -->
    <rect x="160" y="170" width="20" height="172" rx="10" />
    <rect x="332" y="170" width="20" height="172" rx="10" />

    <!-- Inner top dip then re-rise (heart cleavage) -->
    <rect x="192" y="194" width="20" height="124" rx="10" />
    <rect x="300" y="194" width="20" height="124" rx="10" />

    <!-- Center rise -->
    <rect x="224" y="180" width="20" height="152" rx="10" opacity="0.95" />
    <rect x="268" y="180" width="20" height="152" rx="10" opacity="0.95" />

    <!-- Center peak (lowest point of heart) -->
    <rect x="246" y="220" width="20" height="72" rx="10" opacity="0.85" />
  </g>

  <!-- Wordmark -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
     font-weight="900" text-anchor="middle">
    <text x="256" y="430" font-size="64" fill="#FFFFFF" letter-spacing="-1">
      Tune<tspan fill="#FBCFE8">Match</tspan>
    </text>
  </g>
</svg>
